<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMS EcoSky — Adresse et photos de votre chantier</title>
<style>
  :root{
    --pine: #1e6f4c;
    --pine-dark: #14312a;
    --paper: #f4f1e6;
    --line: #e2e0d5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--pine-dark);
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 480px; margin: 0 auto;}
  h1{font-size: 21px; margin: 18px 0 8px;}
  p.lead{font-size: 14.5px; color: #4a5a54; line-height: 1.5; margin-bottom: 24px;}
  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
  }
  label{display:block; font-size: 13.5px; font-weight: 600; margin: 16px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type="text"]{
    width: 100%;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid #d4d0c4;
    font-size: 14px;
    font-family: inherit;
  }
  .photo-input{
    border: 2px dashed #c9c4b4;
    border-radius: 10px;
    padding: 20px 14px;
    text-align: center;
    font-size: 13.5px;
    color: #6b7b74;
    cursor: pointer;
  }
  .photo-input input{display:none;}
  #preview{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  #preview img{
    width: 72px; height: 72px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  button{
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 999px;
    background: var(--pine);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled{opacity: 0.6; cursor: default;}
  #status{
    margin-top: 16px;
    font-size: 13.5px;
    text-align: center;
  }
  #status.success{color: var(--pine);}
  #status.error{color: #b82621;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Une dernière étape</h1>
  <p class="lead">
    Pour affiner votre estimation, indiquez-nous l'adresse exacte du chantier et,
    si possible, quelques photos de la zone concernée.
  </p>

  <div class="card">
    <form id="photoForm">
      <label for="adresse">Adresse exacte du chantier</label>
      <input type="text" id="adresse" placeholder="12 rue des Lilas, 56400 Brech" required>

      <label>Photos (facultatif, plusieurs possibles)</label>
      <label class="photo-input" for="photos">
        📷 Appuyez pour ajouter des photos
        <input type="file" id="photos" accept="image/*" multiple>
      </label>
      <div id="preview"></div>

      <button type="submit" id="submitBtn">Envoyer</button>
      <div id="status"></div>
    </form>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get('lead_id');

  const form = document.getElementById('photoForm');
  const photosInput = document.getElementById('photos');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  let selectedFiles = [];

  photosInput.addEventListener('change', () => {
    selectedFiles = Array.from(photosInput.files);
    preview.innerHTML = '';
    selectedFiles.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = '';

    if (!leadId) {
      statusEl.textContent = "Lien invalide — merci de nous contacter directement.";
      statusEl.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Envoi en cours...';

    try {
      const photos = await Promise.all(
        selectedFiles.map(async (file) => ({
          filename: file.name,
          dataUrl: await fileToBase64(file),
        }))
      );

      const res = await fetch('/api/submit-photos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lead_id: leadId,
          adresse: document.getElementById('adresse').value,
          photos,
        }),
      });
      const data = await res.json();

      if (data.success) {
        statusEl.textContent = 'Merci ! Vos informations ont bien été transmises.';
        statusEl.className = 'success';
        form.querySelectorAll('input, button').forEach(el => el.disabled = true);
      } else {
        throw new Error(data.error || 'Erreur inconnue');
      }
    } catch (err) {
      statusEl.textContent = "Une erreur est survenue. Merci de réessayer ou de nous appeler directement.";
      statusEl.className = 'error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Envoyer';
    }
  });
</script>
</body>
</html>
