<!--
  INTÉGRATION dans public/estimation.html, à l'étape où le téléphone
  est saisi (step 2 d'après le formulaire actuel).

  1) Suppose qu'il existe déjà un <input id="telephone" ...>
     juste après ce champ, ajouter le bloc HTML ci-dessous.
  2) Ajouter le bloc <style> dans le <head> ou la feuille de style existante.
  3) Ajouter le bloc <script> avant la fermeture de </body>, ou dans le
     script principal existant.
  4) Le bouton final "Suivant" / "Continuer" de l'étape 2 doit être
     désactivé tant que window.telephoneVerifie !== true — voir la
     fonction exposée verifierAvantEtapeSuivante() en bas.
-->

<!-- ================= HTML à insérer sous le champ téléphone ================= -->
<div id="smsVerifBlock" style="margin-top:10px;">
  <p style="font-size:0.82rem; color:#5b6b64; margin-bottom:10px; line-height:1.4;">
    Cette vérification nous permet de nous assurer qu'un vrai numéro est associé à votre demande,
    pour éviter les robots et vous garantir une réponse de notre part.
  </p>
  <button type="button" id="btnEnvoyerCode" class="btn-secondaire-sms">
    Vérifier mon numéro par SMS
  </button>

  <div id="smsCodeZone" style="display:none; margin-top:12px;">
    <label for="smsCode" style="display:block; font-weight:600; font-size:0.88rem; margin-bottom:6px;">
      Code reçu par SMS
    </label>
    <div style="display:flex; gap:8px;">
      <input type="text" id="smsCode" inputmode="numeric" maxlength="6" placeholder="123456"
             style="flex:1; padding:12px 14px; border:1.5px solid #d8e3de; border-radius:10px; font-size:1.1rem; letter-spacing:0.2em; text-align:center;">
      <button type="button" id="btnVerifierCode" class="btn-secondaire-sms">Valider</button>
    </div>
    <div id="smsRenvoyer" style="margin-top:8px; font-size:0.82rem; color:#5b6b64;">
      <span id="smsCountdown"></span>
      <a href="#" id="lienRenvoyerCode" style="display:none; color:#1e6f4c;">Renvoyer le code</a>
    </div>
  </div>

  <div id="smsStatus" style="margin-top:8px; font-size:0.85rem;"></div>
</div>

<!-- ================= CSS ================= -->
<style>
  .btn-secondaire-sms {
    background: #eef4f0;
    color: #1e6f4c;
    border: 1.5px solid #1e6f4c;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-secondaire-sms:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondaire-sms:hover:not(:disabled) { background: #1e6f4c; color: white; }
  .sms-status-ok { color: #1e6f4c; font-weight: 600; }
  .sms-status-error { color: #991b1b; }
  .sms-status-loading { color: #5b6b64; }
</style>

<!-- ================= JS ================= -->
<script>
(function () {
  window.telephoneVerifie = false; // exposé globalement pour bloquer la suite du formulaire

  const btnEnvoyer = document.getElementById("btnEnvoyerCode");
  const btnVerifier = document.getElementById("btnVerifierCode");
  const codeZone = document.getElementById("smsCodeZone");
  const codeInput = document.getElementById("smsCode");
  const statusBox = document.getElementById("smsStatus");
  const countdownEl = document.getElementById("smsCountdown");
  const lienRenvoyer = document.getElementById("lienRenvoyerCode");
  const telephoneInput = document.getElementById("telephone"); // adapter l'id si différent

  let countdownTimer = null;

  function setStatus(msg, type) {
    statusBox.textContent = msg;
    statusBox.className = type ? `sms-status-${type}` : "";
  }

  function startCountdown(seconds) {
    let remaining = seconds;
    lienRenvoyer.style.display = "none";
    countdownEl.textContent = `Renvoi possible dans ${remaining}s`;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(countdownTimer);
        countdownEl.textContent = "";
        lienRenvoyer.style.display = "inline";
      } else {
        countdownEl.textContent = `Renvoi possible dans ${remaining}s`;
      }
    }, 1000);
  }

  async function envoyerCode() {
    const telephone = telephoneInput ? telephoneInput.value.trim() : "";
    if (!telephone) {
      setStatus("Merci de saisir votre numéro de téléphone d'abord.", "error");
      return;
    }
    btnEnvoyer.disabled = true;
    setStatus("Envoi du code en cours…", "loading");
    try {
      const res = await fetch("/api/verify-send-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telephone }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Erreur lors de l'envoi du code.");
      codeZone.style.display = "block";
      setStatus("Code envoyé par SMS. Il peut prendre quelques secondes à arriver.", "ok");
      startCountdown(30);
    } catch (err) {
      setStatus(err.message, "error");
    } finally {
      btnEnvoyer.disabled = false;
    }
  }

  async function verifierCode() {
    const telephone = telephoneInput ? telephoneInput.value.trim() : "";
    const code = codeInput.value.trim();
    if (!code) {
      setStatus("Merci de saisir le code reçu.", "error");
      return;
    }
    btnVerifier.disabled = true;
    setStatus("Vérification en cours…", "loading");
    try {
      const res = await fetch("/api/verify-check-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telephone, code }),
      });
      const data = await res.json();
      if (!data.success || !data.verified) throw new Error(data.error || "Code invalide.");
      window.telephoneVerifie = true;
      setStatus("✓ Numéro vérifié.", "ok");
      btnEnvoyer.style.display = "none";
      codeZone.style.display = "none";
    } catch (err) {
      window.telephoneVerifie = false;
      setStatus(err.message, "error");
    } finally {
      btnVerifier.disabled = false;
    }
  }

  btnEnvoyer.addEventListener("click", envoyerCode);
  btnVerifier.addEventListener("click", verifierCode);
  lienRenvoyer.addEventListener("click", (e) => {
    e.preventDefault();
    envoyerCode();
  });

  // Si le client modifie le numéro après vérification, on invalide la vérification
  if (telephoneInput) {
    telephoneInput.addEventListener("input", () => {
      if (window.telephoneVerifie) {
        window.telephoneVerifie = false;
        btnEnvoyer.style.display = "inline-block";
        setStatus("Numéro modifié — merci de le revérifier.", "error");
      }
    });
  }

  // À appeler avant de laisser passer à l'étape suivante du formulaire
  window.verifierAvantEtapeSuivante = function () {
    if (!window.telephoneVerifie) {
      setStatus("Merci de vérifier votre numéro par SMS avant de continuer.", "error");
      codeZone.scrollIntoView({ behavior: "smooth", block: "center" });
      return false;
    }
    return true;
  };
})();
</script>
