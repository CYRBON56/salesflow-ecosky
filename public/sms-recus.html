<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS reçus — SalesFlow System</title>
<style>
  :root {
    --vert: #14312a;
    --vert-clair: #1e6f4c;
    --bg: #f5f8f6;
    --bordure: #e2e8e5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--vert);
  }
  header {
    background: var(--vert);
    color: white;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
  header .sous-titre { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
  .controles {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  select, button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--bordure);
    background: white;
    color: var(--vert);
    cursor: pointer;
  }
  button.principal {
    background: var(--vert-clair);
    color: white;
    border: none;
    font-weight: 600;
  }
  main { padding: 20px 28px 60px; max-width: 1200px; margin: 0 auto; }
  .stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .stat-carte {
    background: white;
    border: 1px solid var(--bordure);
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 140px;
  }
  .stat-carte .valeur { font-size: 1.5rem; font-weight: 700; }
  .stat-carte .libelle { font-size: 0.78rem; color: #5a6b64; margin-top: 2px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(20,49,42,0.08);
  }
  thead { background: #eef4f1; }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--bordure);
    white-space: nowrap;
  }
  th { font-weight: 700; color: var(--vert); }
  tbody tr:hover { background: #f8fbfa; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .badge-ok { background: #e3f5e9; color: #1e6f4c; }
  .badge-ko { background: #fbe6e6; color: #b3261e; }
  .badge-type {
    background: #eef4f1;
    color: var(--vert);
    font-weight: 600;
  }
  .msg-col {
    max-width: 320px;
    white-space: normal;
    font-size: 0.78rem;
    color: #4a5a54;
  }
  .vide { padding: 40px; text-align: center; color: #7a8983; }
  .chargement { padding: 40px; text-align: center; color: #7a8983; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📩 SMS reçus</h1>
    <div class="sous-titre">Historique des notifications SMS envoyées automatiquement</div>
  </div>
  <div class="controles">
    <select id="filtreType">
      <option value="">Tous les types</option>
      <option value="arrivee_pub">Arrivée pub</option>
      <option value="catalogue_telecharge">Catalogue téléchargé</option>
      <option value="clic_devis">Clic devis</option>
      <option value="etude_anc_uploadee">Étude ANC</option>
      <option value="demande_rappel">Demande de rappel</option>
      <option value="nouveau_clic">Nouveau clic</option>
    </select>
    <button class="principal" id="btnActualiser">🔄 Actualiser</button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="conteneurTableau">
    <div class="chargement">Chargement…</div>
  </div>
</main>

<script>
  const API_URL = "/api/sms-recus";

  const LIBELLES_TYPE = {
    arrivee_pub: "Arrivée pub",
    catalogue_telecharge: "Catalogue téléchargé",
    clic_devis: "Clic devis",
    etude_anc_uploadee: "Étude ANC",
    demande_rappel: "Demande de rappel",
    nouveau_clic: "Nouveau clic",
  };

  let toutesLesLignes = [];

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString("fr-FR", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function renderStats(lignes) {
    const total = lignes.length;
    const reussis = lignes.filter(l => l.twilio_success === true).length;
    const echoues = lignes.filter(l => l.twilio_success === false).length;
    document.getElementById("stats").innerHTML = `
      <div class="stat-carte"><div class="valeur">${total}</div><div class="libelle">Total affiché</div></div>
      <div class="stat-carte"><div class="valeur">${reussis}</div><div class="libelle">Envoyés avec succès</div></div>
      <div class="stat-carte"><div class="valeur">${echoues}</div><div class="libelle">Échecs</div></div>
    `;
  }

  function renderTable(lignes) {
    const conteneur = document.getElementById("conteneurTableau");
    if (!lignes.length) {
      conteneur.innerHTML = `<div class="vide">Aucun SMS pour ce filtre.</div>`;
      return;
    }
    const lignesHtml = lignes.map(l => `
      <tr>
        <td>${formatDate(l.created_at)}</td>
        <td><span class="badge badge-type">${LIBELLES_TYPE[l.sms_type] || l.sms_type}</span></td>
        <td>${l.source || "—"}</td>
        <td>${l.utm_campaign || "—"}</td>
        <td>${[l.geo_city, l.geo_country].filter(Boolean).join(", ") || "—"}</td>
        <td>${l.twilio_success === true ? '<span class="badge badge-ok">Envoyé</span>' : l.twilio_success === false ? '<span class="badge badge-ko">Échec</span>' : "—"}</td>
        <td class="msg-col">${(l.message_body || "").replace(/</g, "&lt;")}</td>
      </tr>
    `).join("");
    conteneur.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Date / heure</th>
            <th>Type</th>
            <th>Source / nom</th>
            <th>Campagne / commune</th>
            <th>Localisation</th>
            <th>Statut</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody>${lignesHtml}</tbody>
      </table>
    `;
  }

  function appliquerFiltre() {
    const type = document.getElementById("filtreType").value;
    const lignes = type ? toutesLesLignes.filter(l => l.sms_type === type) : toutesLesLignes;
    renderStats(lignes);
    renderTable(lignes);
  }

  async function chargerDonnees() {
    document.getElementById("conteneurTableau").innerHTML = `<div class="chargement">Chargement…</div>`;
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Erreur inconnue");
      toutesLesLignes = data.rows || [];
      appliquerFiltre();
    } catch (err) {
      document.getElementById("conteneurTableau").innerHTML =
        `<div class="vide">Erreur de chargement : ${err.message}</div>`;
    }
  }

  document.getElementById("filtreType").addEventListener("change", appliquerFiltre);
  document.getElementById("btnActualiser").addEventListener("click", chargerDonnees);

  chargerDonnees();
</script>

</body>
</html>
